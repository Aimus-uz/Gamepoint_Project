name: Build plugins

on:
  push:
    branches: ["main"]
    paths: ["plugins/**", ".github/workflows/build-plugins.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PMM_WeaponSkins (fork of RRimmer/PMM_WeaponSkins, GPL-3.0) restyled to the GAMEPOINT design system.
  # The menu stylesheet is generated: tools/pmm_ws.base.css + PALETTE in tools/gen_layout.py -> pmm_ws.css.
  pmm-weaponskins:
    runs-on: ubuntu-latest
    env:
      ROOT: plugins/PMM_WeaponSkins
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate layout and stylesheet
        run: |
          python3 $ROOT/tools/gen_layout.py $ROOT/PMM_WeaponSkins
          # show whether the committed generated files were out of date
          git status --short $ROOT || true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet publish $ROOT/PMM_WeaponSkins/PMM_WeaponSkins.csproj -c Release -o out/PMM_WeaponSkins

      - name: Package (Server-plugins + Content-addonmanager, like the upstream release)
        run: |
          S=package/Server-plugins/counterstrikesharp
          mkdir -p $S/plugins $S/configs/plugins
          mv out/PMM_WeaponSkins $S/plugins/
          # CounterStrikeSharp already provides these; keep only what the upstream release ships
          rm -f $S/plugins/PMM_WeaponSkins/CounterStrikeSharp.API.dll $S/plugins/PMM_WeaponSkins/Microsoft.Extensions.*.dll
          cp -r $ROOT/configs/plugins/PMM_WeaponSkins $S/configs/plugins/
          mkdir -p package/Content-addonmanager
          cp -r $ROOT/PMM_WeaponSkins/panorama package/Content-addonmanager/
          # generated sources, so they can be committed back if they changed
          mkdir -p package/generated
          cp $ROOT/PMM_WeaponSkins/Layout.g.cs $ROOT/PMM_WeaponSkins/panorama/styles/custom_game/pmm_ws.css package/generated/
          find package -type f | grep -v '_art\|_stickers' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: PMM_WeaponSkins
          path: package/

  # jRandomSkills (fork of Juzlus/jRandomSkills, GPL-3.0) with the GAMEPOINT Panorama HUD.
  # The HUD stylesheet is generated: BASE in "VPK Addon/tools/build_css.py" + one class per skill colour.
  jrandomskills:
    runs-on: ubuntu-latest
    env:
      ROOT: plugins/jRandomSkills
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate HUD stylesheet
        run: |
          python3 "$ROOT/VPK Addon/tools/build_css.py" \
            "$ROOT/VPK Addon/Content/panorama/styles/custom_game/gamepoint/jrs_hud.css" \
            "$ROOT/jRandomSkills - Server Files/plugins/jRandomSkills/configs/skillsInfo.json" \
            "$ROOT/jRandomSkills - SRC Files/src"
          git status --short "$ROOT" || true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet publish "$ROOT/jRandomSkills - SRC Files/jRandomSkills.csproj" -c Release -o out/jRandomSkills

      - name: Package (Server-plugins + Content-addonmanager)
        run: |
          S=package/Server-plugins/counterstrikesharp
          P=$S/plugins/jRandomSkills
          mkdir -p $P $S/gamedata
          # only what the upstream release ships; CounterStrikeSharp provides the rest
          for f in jRandomSkills WASDMenuAPI MaxMind.Db Newtonsoft.Json; do cp out/jRandomSkills/$f.dll $P/; done
          cp -r "$ROOT/jRandomSkills - Server Files/plugins/jRandomSkills/configs" "$ROOT/jRandomSkills - Server Files/plugins/jRandomSkills/languages" $P/
          cp "$ROOT/jRandomSkills - Server Files/gamedata/"*.json $S/gamedata/
          mkdir -p package/Content-addonmanager
          cp -r "$ROOT/VPK Addon/Content/panorama" package/Content-addonmanager/
          find package -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: jRandomSkills
          path: package/
